services:
  - type: web
    name: metamorfosis-os
    runtime: node
    plan: free
    buildCommand: npm ci --registry=https://registry.npmjs.org/ --no-audit --no-fund && npm run build:admin
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NPM_CONFIG_REGISTRY
        value: https://registry.npmjs.org/
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: PUBLIC_ORIGINS
        value: https://metamorfosislab.cl,https://www.metamorfosislab.cl
      - key: VITE_PUBLIC_SITE_URL
        value: https://www.metamorfosislab.cl
